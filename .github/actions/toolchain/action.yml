name: toolchain
description: Install and cache what scripts/release.sh needs on this runner.

inputs:
  target:
    required: true
  kind:
    description: test or build, so test and release builds keep separate caches
    required: true

runs:
  using: composite
  steps:
    - if: runner.os == 'macOS'
      uses: cachix/install-nix-action@v31
    - if: runner.os == 'macOS'
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ inputs.target }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ inputs.target }}-
        gc-max-store-size: 8G
    - if: runner.os == 'macOS'
      shell: bash
      run: nix --extra-experimental-features 'nix-command flakes' develop -c true
    # The engine's build script builds the web app with bun; the macOS nix shell has its own.
    - if: runner.os != 'macOS'
      uses: oven-sh/setup-bun@v2
    # libtorrent's Boost and OpenSSL, static on Rust's default dynamic CRT.
    # Saved as soon as it is built, so a job that fails later still keeps it.
    - if: runner.os == 'Windows'
      id: vcpkg
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/vcpkg
        key: vcpkg-${{ inputs.target }}-${{ hashFiles('crates/engine/vcpkg.json') }}
    - if: runner.os == 'Windows' && steps.vcpkg.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static-md --x-manifest-root=crates/engine --x-install-root="$env:RUNNER_TEMP\vcpkg"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - if: runner.os == 'Windows' && steps.vcpkg.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/vcpkg
        key: vcpkg-${{ inputs.target }}-${{ hashFiles('crates/engine/vcpkg.json') }}
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $root = "$env:RUNNER_TEMP\vcpkg\x64-windows-static-md"
        Add-Content $env:GITHUB_ENV "BOOST_ROOT=$root"
        Add-Content $env:GITHUB_ENV "OPENSSL_INCLUDE_DIR=$root\include"
        Add-Content $env:GITHUB_ENV "OPENSSL_LIB_DIR=$root\lib"
    # cl.exe, CMake and Ninja for libtorrent's build.
    - if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-${{ inputs.kind }}-${{ inputs.target }}-${{ hashFiles('Cargo.lock', 'vendor/libtorrent/CMakeLists.txt', 'crates/engine/build.rs') }}-${{ github.sha }}
        restore-keys: |
          cargo-${{ inputs.kind }}-${{ inputs.target }}-${{ hashFiles('Cargo.lock', 'vendor/libtorrent/CMakeLists.txt', 'crates/engine/build.rs') }}-
          cargo-${{ inputs.kind }}-${{ inputs.target }}-
