name: install

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version the installer should report, such as 0.1.3
        required: true

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install with the one-liner
        env:
          WANT: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          want=${WANT#v}
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL https://raw.githubusercontent.com/nexxeln/torrential/main/install.sh | sh
            got=$("$HOME/.local/bin/torrential" --version)
            echo "$got"
            [ "$got" = "torrential $want" ] && exit 0
            echo "expected torrential $want; retrying in 20s"
            sleep 20
          done
          exit 1
