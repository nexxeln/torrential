name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # The bun the flake's nixpkgs gives `nix develop`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun test

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          kind: test
      - run: scripts/release.sh test

  windows:
    runs-on: windows-latest
    steps:
      # Tests compare files byte for byte, and libtorrent's submodules have long paths.
      - run: git config --global core.autocrlf false; git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
        with:
          target: x86_64-pc-windows-msvc
          kind: test
      # The command line's own tests start engines with shell-script stand-ins, so they come in W7.
      - run: cargo test --locked -p torrential-engine -p torrential-core -p torrential-search -p torrential-daemon -p torrential-tui
      - run: cargo test --locked -p torrential --bin torrential
