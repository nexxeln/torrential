[package]
name = "torrential"
description = "Search torrent indexes and download torrents from a terminal or a coding agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "torrential"
path = "src/main.rs"

[dependencies]
torrential-core = { path = "../core" }
torrential-engine = { path = "../engine" }
torrential-search = { path = "../search" }
torrential-tui = { path = "../tui" }
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
ctrlc = "3.5"
dirs = "7"
flate2 = "1"
getrandom = "0.3"
globset = "0.4"
httparse = "1.10"
indicatif = "0.18"
libc = "0.2"
qrcodegen = "1.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
socket2 = "0.6"
tar = { version = "0.4", default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros", "io-util", "fs", "process"] }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
assert_cmd = "2.2"
insta = { version = "1.49", features = ["json"] }
tempfile = "3.27"
tokio = { version = "1.53", features = ["test-util"] }
