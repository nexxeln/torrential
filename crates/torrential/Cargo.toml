[package]
name = "torrential"
description = "Search torrent indexes and download torrents from a terminal or a coding agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "torrential"
path = "src/main.rs"

[dependencies]
torrential-core = { path = "../core" }
torrential-daemon = { path = "../daemon" }
torrential-search = { path = "../search" }
torrential-tui = { path = "../tui" }
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
ctrlc = "3.5"
globset = "0.4"
httparse = "1.10"
indicatif = "0.18"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["rt"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.2"
flate2 = "1"
insta = { version = "1.49", features = ["json"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3.27"
torrential-engine = { path = "../engine" }
