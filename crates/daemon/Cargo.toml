[package]
name = "torrential-daemon"
description = "The torrential engine and what the engine and the CLI share"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
torrential-core = { path = "../core" }
torrential-engine = { path = "../engine" }
torrential-search = { path = "../search" }
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
flate2 = "1"
getrandom = "0.3"
globset = "0.4"
httparse = "1.10"
libc = "0.2"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "optimization"] }
qrcodegen = "1.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
socket2 = "0.6"
tar = { version = "0.4", default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros", "io-util", "fs", "process"] }
url = "2.5"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# The COM `implement` macro names this crate.
windows-core = "0.61"

[dev-dependencies]
insta = { version = "1.49", features = ["json"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
tempfile = "3.27"
tokio = { version = "1.53", features = ["test-util"] }
torrential-core = { path = "../core", features = ["ts"] }
ts-rs = "12"
