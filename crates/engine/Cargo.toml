[package]
name = "torrential-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "torrent-rasterbar"

[dependencies]
cxx = "1"
socket2 = "0.6"
torrential-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[build-dependencies]
cmake = "0.1"
cxx-build = "1"

[dev-dependencies]
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
